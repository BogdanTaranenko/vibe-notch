name: CI

# Every branch, not just main: a net that only catches things at merge time
# lets a branch sit broken for days. `branches` is set rather than omitted so
# the release tags create-release.sh pushes do not each trigger a second run.
on:
  push:
    branches: ['**']
  pull_request:

# Keyed on the branch name rather than the ref, so a same-repo pull request
# does not run the suite twice -- `head_ref` on a pull_request event and
# `ref_name` on a push both resolve to the branch, landing in one group.
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      # -onlyUsePackageVersionsFromResolvedFile makes resolution fail rather than
      # silently update, so a PR that changes a package requirement without
      # committing the new Package.resolved stops here.
      - name: Resolve dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -scheme ClaudeIsland \
            -onlyUsePackageVersionsFromResolvedFile

      # Belt and braces: catches resolution that succeeded but rewrote the file.
      # This app is signed, notarized and auto-updated, so every release has to
      # build from exactly the revisions someone reviewed.
      - name: Package.resolved is unchanged
        run: |
          git diff --exit-code \
            -- ClaudeIsland.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

      # The test bundle is hostless — it compiles the sources under test directly
      # rather than launching the app, which would rewrite the runner's
      # ~/.claude and need a GUI session.
      - name: Test
        run: |
          xcodebuild test \
            -scheme ClaudeIsland \
            -destination 'platform=macOS' \
            -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGNING_ALLOWED=NO

      # Debug is what `xcodebuild test` builds; Release is what ships, and it
      # optimises differently. Build both or find out at release time.
      - name: Build Release
        run: |
          xcodebuild build \
            -scheme ClaudeIsland \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/Logs/Test/*.xcresult
          retention-days: 5
          if-no-files-found: ignore
