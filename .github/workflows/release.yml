name: Release

# Tags only. Releasing on every push to main would cut a version for a README
# fix, and the version a release carries is hand-set in project.pbxproj — the
# tag is the only place anyone states the intent to ship.
on:
  push:
    tags: ['v*']
  # Builds and signs without releasing anything. The certificate import is the
  # part that cannot be checked locally, so it needs a way to be exercised that
  # does not cut a release to find out.
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build, notarize and publish
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4
        with:
          # create-release.sh commits the appcast and pushes it to main, which
          # needs real history rather than a shallow clone.
          fetch-depth: 0

      # Same pin and reasoning as ci.yml: the runner's default Xcode predates
      # SWIFT_DEFAULT_ACTOR_ISOLATION and ignores it rather than rejecting it.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.x'

      # The tag names the version; project.pbxproj decides what the app actually
      # reports. If they disagree the release is mislabelled, Sparkle compares
      # the wrong versions, and the DMG filename does not match the appcast.
      - name: Tag matches project version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          versions=$(grep -E 'MARKETING_VERSION' ClaudeIsland.xcodeproj/project.pbxproj \
            | sed -E 's/.*= (.*);/\1/' | sort -u)
          if [ "$(echo "$versions" | wc -l)" -ne 1 ]; then
            echo "MARKETING_VERSION differs between build configurations:"
            echo "$versions"
            echo "Set it to the same value in both the Debug and Release blocks."
            exit 1
          fi
          builds=$(grep -E 'CURRENT_PROJECT_VERSION' ClaudeIsland.xcodeproj/project.pbxproj \
            | sed -E 's/.*= (.*);/\1/' | sort -u)
          if [ "$(echo "$builds" | wc -l)" -ne 1 ]; then
            echo "CURRENT_PROJECT_VERSION differs between build configurations:"
            echo "$builds"
            exit 1
          fi
          tag="${GITHUB_REF_NAME#v}"
          if [ "$versions" != "$tag" ]; then
            echo "Tag $GITHUB_REF_NAME does not match MARKETING_VERSION $versions."
            echo "Bump the project version and re-tag, or tag v$versions."
            exit 1
          fi
          echo "Releasing $versions (build $builds) as $GITHUB_REF_NAME."

      - name: Resolve dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -scheme ClaudeIsland \
            -onlyUsePackageVersionsFromResolvedFile

      - name: Package.resolved is unchanged
        run: |
          git diff --exit-code \
            -- ClaudeIsland.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

      # A release that fails its own tests is not one to ship. Same hostless
      # bundle ci.yml runs.
      - name: Test
        run: |
          xcodebuild test \
            -scheme ClaudeIsland \
            -destination 'platform=macOS' \
            -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGNING_ALLOWED=NO

      # A dedicated keychain, deleted in the final step. Importing into the
      # login keychain would leave the Developer ID key sitting on the runner
      # image for whatever runs next.
      - name: Import signing certificate
        env:
          CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${CERTIFICATE_P12:-}" ]; then
            echo "DEVELOPER_ID_CERTIFICATE_P12 is not set. See RELEASING.md."
            exit 1
          fi

          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # Long enough for a notarization wait; the default would relock the
          # keychain mid-run and the DMG signing would fail with no useful error.
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          echo "$CERTIFICATE_P12" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" \
            -k "$KEYCHAIN" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          rm -f "$CERT_PATH"

          # Without this, codesign prompts for keychain access and hangs the job.
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null

          # xcodebuild and create-release.sh's find-identity both search the
          # user keychain list, so the new keychain has to join it — and
          # xcodebuild resolves an identity against the default keychain, which
          # the search list alone does not change.
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN"

          echo "Identities available:"
          security find-identity -v -p codesigning "$KEYCHAIN"

          if ! security find-identity -v -p codesigning "$KEYCHAIN" \
            | grep -q "Developer ID Application"; then
            echo "No Developer ID Application identity in the imported .p12."
            echo "Export it from Xcode with its private key. See RELEASING.md."
            exit 1
          fi

      - name: Write Sparkle signing key
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SPARKLE_PRIVATE_KEY:-}" ]; then
            echo "SPARKLE_EDDSA_PRIVATE_KEY is not set. See RELEASING.md."
            exit 1
          fi
          mkdir -p .sparkle-keys
          printf '%s' "$SPARKLE_PRIVATE_KEY" > .sparkle-keys/eddsa_private_key
          chmod 600 .sparkle-keys/eddsa_private_key
          # This must be the same key every previous release was signed with.
          # A different one produces a feed every installed client rejects, and
          # create-release.sh's own check would not catch it — it verifies the
          # appcast is signed, not that it is signed with the key users trust.

      - name: Build and sign
        env:
          SIGNING_STYLE: manual
        run: ./scripts/build.sh

      - name: Verify the exported app is signed
        run: |
          set -euo pipefail
          APP="build/export/Vibe Notch.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dvv "$APP" 2>&1 | grep -E "Authority|TeamIdentifier"
          # Hardened runtime is a notarization requirement, so catching its
          # absence here beats waiting for Apple to reject the submission.
          if ! codesign -d --entitlements - "$APP" >/dev/null 2>&1; then
            echo "Could not read entitlements from the signed app."
            exit 1
          fi
          codesign -dvv "$APP" 2>&1 | grep -q "flags=.*runtime" \
            || { echo "Hardened runtime is not enabled."; exit 1; }

      - name: Manual run summary
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          echo "Manual run: the build signed cleanly. Nothing published."
          echo "Push a v* tag to cut an actual release."

      # generate_appcast computes deltas by comparing the DMGs it finds in one
      # directory, and rewrites the whole feed from them. On a runner that
      # directory starts empty, so without this the release would ship no deltas
      # and an appcast that had dropped every earlier version.
      - name: Fetch previous releases for delta generation
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p releases/appcast
          for tag in $(gh release list --limit 20 --json tagName -q '.[].tagName'); do
            gh release download "$tag" --pattern '*.dmg' \
              --dir releases/appcast --clobber || echo "no DMG on $tag, skipping"
          done
          ls -la releases/appcast

      - name: Notarize, package and publish
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          ASC_KEY: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          if [ -z "${ASC_KEY:-}" ]; then
            echo "ASC_API_KEY_P8 is not set. See RELEASING.md."
            exit 1
          fi

          KEY_PATH="$RUNNER_TEMP/asc_api_key.p8"
          printf '%s' "$ASC_KEY" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"

          # create-release.sh reads NOTARY_ARGS in place of its keychain profile.
          export NOTARY_ARGS="--key $KEY_PATH --key-id $ASC_KEY_ID --issuer $ASC_ISSUER_ID"

          # build.sh uses the default derived data location, so the Sparkle
          # artifacts land under the runner's home rather than anywhere the
          # script's own glob would look first.
          SPARKLE_BIN_DIR=$(find "$HOME/Library/Developer/Xcode/DerivedData" \
            -type d -path '*artifacts/sparkle/Sparkle/bin' 2>/dev/null | head -1)
          export SPARKLE_BIN_DIR
          echo "Sparkle tools: ${SPARKLE_BIN_DIR:-<not found>}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          export ASSUME_YES=true
          ./scripts/create-release.sh

          rm -f "$KEY_PATH"

      # Proves the thing users actually consume is reachable, rather than
      # trusting that the upload and the URL rewrite agreed with each other.
      - name: Verify the published feed
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          failed=0
          for url in $(grep -oE 'url="[^"]+"' appcast.xml | sed 's/url="//;s/"//'); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -L "$url")
            echo "$code  $(basename "$url")"
            [ "$code" = "200" ] || failed=1
          done
          if [ "$failed" -ne 0 ]; then
            echo "The appcast advertises files that do not resolve."
            exit 1
          fi

      - name: Remove the signing keychain
        if: always()
        run: |
          if [ -n "${SIGNING_KEYCHAIN:-}" ] && [ -f "$SIGNING_KEYCHAIN" ]; then
            security delete-keychain "$SIGNING_KEYCHAIN" || true
          fi
          rm -f .sparkle-keys/eddsa_private_key "$RUNNER_TEMP/asc_api_key.p8"
